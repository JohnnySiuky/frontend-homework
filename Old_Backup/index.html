<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paint Quote System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!--左邊文字-->
        <div class="left-session">
            <h1><span>Welcome to Paint Quote System</span></h1>
            <p>Consequat adipiscing ea do labore irure adipiscing<br>occaecat cupidatat excepteur duis mollit est.</p>
        </div>
        <!--右邊卡-->
        <div class="right-session">
            <div class="card">
                <h2>Sign Up</h2>
                <p class="subtitle">Enter details to create your account</p>

                <form id = "signupform">
                    <label for = "username">Your Name</label>
                    <input type="text" id = "username" placeholder="Enter your name">
                    <br>
                    <label for = "phone">Phone number</label>
                    <input type="text" id = "phone" placeholder="Enter your phone numbere">
                    <br>
                    <label for = "account">Dulux account</label>
                    <input type="text" id = "account" placeholder="Enter your Dulux account">
                    <br>
                    <button type="submit">Sign Up</button>
                </form>

                <p class="signin-text">Already have your Account? <a href="#">Sign in</a></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
